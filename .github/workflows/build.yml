
name: Build Cube Flip APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Extract project
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -type f -iname "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project
          

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubeFlip-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
